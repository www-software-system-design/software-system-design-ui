name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Plan the versioned release
        id: plan
        uses: actions/github-script@v8
        with:
          script: |
            const { planRelease } = await import(require('node:url').pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/automatic-release.mjs`).href);
            await planRelease({ github, context, core });
      - uses: actions/setup-node@v6
        if: steps.plan.outputs.release_needed == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Validate the exact release commit and packed consumer
        if: steps.plan.outputs.release_needed == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          npm install --global npm@11.19.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:stories
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:storybook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:visual
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tag the validated commit
        if: steps.plan.outputs.release_needed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { ensureTag } = await import(require('node:url').pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/automatic-release.mjs`).href);
            await ensureTag({ github, context });
      - name: Publish the tested tarball using npm trusted publishing
        if: steps.plan.outputs.publish_needed == 'true'
        shell: pwsh
        run: |
          $artifact = Get-Content -LiteralPath .artifacts/package.json -Raw | ConvertFrom-Json
          npm publish $artifact.tarball --provenance --access public
      - name: Verify npm integrity and publish the GitHub release
        if: steps.plan.outputs.release_needed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { completeRelease } = await import(require('node:url').pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/automatic-release.mjs`).href);
            const release = await completeRelease({ github, context });
            core.info(`GitHub release: ${release.html_url}`);
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-failures
          path: |
            **/test-results/**
            **/playwright-report/**
