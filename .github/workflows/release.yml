name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable version tag to publish, such as v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      NEXT_TELEMETRY_DISABLED: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check:release
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run test:stories
      - run: npm run build:storybook
      - run: npm run test:visual
      - run: npm run test:integration
      - name: Publish the tested tarball using npm trusted publishing
        shell: pwsh
        run: |
          $artifact = Get-Content -LiteralPath .artifacts/package.json -Raw | ConvertFrom-Json
          npm publish $artifact.tarball --provenance --access public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-failures
          path: |
            **/test-results/**
            **/playwright-report/**
