version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - npm ci --cache .npm-cache --prefer-offline
    build:
      commands:
        - npm run build:storybook
  artifacts:
    baseDirectory: storybook-static
    files:
      - '**/*'
  cache:
    paths:
      - .npm-cache/**/*
